{% extends 'base.html' %}

{% block custom_style %}
  <style>
    body {
      background-color: #242323;
    }
    .container {
      background-color: #eee;
      padding: 15px;
    }
    
    .video-list-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    
      margin-bottom: 10px;
      border-radius: 2px;
      background-color: black;
      color: white;
    }
    .video-list-item:hover {
      border: #c0f03c solid 2px;
    }
    
    .video-thumbnail {
      max-width: 120px;
      margin-right: 15px;
    }
    
    .video-details {
      flex-grow: 1;
    }
    .outside {
      height: 100%;
      background: #242323;
      padding: 10px;
    }
    .container {
      background-color: #242424;
    }
    .btn {
      background-color: #c0f03c;
      color: black;
    }
  </style>
{% endblock %}
{% block title %}
  Diet
{% endblock %}

{% block body %}
  <div class="outside">
    <div class="container mt-0">
      {% for x in dietposts %}
        <div class="video-list-item">
          <img src="{{ x.diet_image.url }}" alt="Diet Thumbnail" class="video-thumbnail" />
          <div class="video-details">
            <h5>{{ x.name }} - {{ x.typeName }}</h5>
            <p>{{ x.desc }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <div class="btn-group">
                <a type="button" href="{% url 'dietcontent' x.name %}" class="btn btn-sm btn-outline-secondary">View</a>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
