{% extends 'base.html' %}

{% block title %}
  BMI calulator
{% endblock %}
{% block custom_style %}
  <style>
    .container,
    body {
      color: white;
      background-color: #242323;
    }
    .btn {
      background-color: #c0f03c;
      color: black;
    }
    .form-control:focus {
      background-color: #c0f03c;
    }
    b {
      color: #c0f03c;
    }
    .resultDiv {
      font-size: 2rem;
    }
  </style>
{% endblock %}

{% block body %}
  <script>
    window.onload = () => {
      let button = document.querySelector('#btn')
    
      button.addEventListener('click', calculateBMI)
    }
    
    function calculateBMI() {
      let height = parseInt(document.querySelector('#height').value)
    
      let weight = parseInt(document.querySelector('#weight').value)
    
      let result = document.querySelector('#result')
    
      if (height === '' || isNaN(height)) result.innerHTML = 'Provide a valid Height!'
      else if (weight === '' || isNaN(weight)) result.innerHTML = 'Provide a valid Weight!'
      else {
        let bmi = (weight / ((height * height) / 10000)).toFixed(2)
    
        if (bmi < 18.6) result.innerHTML = <b>Under Weight</b> : <span>${bmi}</span>
        else if (bmi >= 18.6 && bmi < 24.9) result.innerHTML = <b>Normal :</b> <span>${bmi}</span>
        else result.innerHTML = <b>Over Weight </b>: <span>${bmi}</span>
      }
    }
  </script>
  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1 class="display-6"><b>BMI</b> Calculator</h1>
    </div>
  </div>
  <div class="container">
    <div class="form-group">
      <label for="height">Height (in cm)</label>
      <input type="text" class="form-control" id="height" />
    </div>
    <div class="form-group">
      <label for="weight">Weight (in kg)</label>
      <input type="text" class="form-control" id="weight" />
    </div>

    <div class="mx-auto" style="width: 200px;">
      <button id="btn" class="btn">Calculate</button>
    </div>
    <div class="resultDiv" id="result"></div>
  </div>
{% endblock %}
